openapi: 3.0.1
info:
  title: Unsupported Array Style API
  version: 1.0.0
paths:
  /items:
    get:
      tags: [items]
      operationId: listItems
      parameters:
        - name: ids
          in: query
          style: pipeDelimited
          schema:
            type: array
            items:
              type: string
      responses:
        '204':
          description: Success
