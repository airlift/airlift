openapi: 3.0.1
info:
  title: JSON And Event Stream API
  version: 1.0.0
paths:
  /events:
    get:
      tags: [events]
      operationId: events
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '201':
          description: Stream
          content:
            text/event-stream:
              x-airlift-event-schema:
                $ref: '#/components/schemas/Event'
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
components:
  schemas:
    Event:
      type: object
      properties:
        message:
          type: string
