openapi: 3.0.1
info:
  title: Mixed Success API
  version: 1.0.0
paths:
  /job:
    get:
      tags: [jobs]
      operationId: getJob
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
        '204':
          description: No job
